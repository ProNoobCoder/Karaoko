<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b0b18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="KaraoKo"/>
<title>KaraoKo – Sing Together</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── THEMES ── */
body[data-theme="neon"] {
  --bg:#0b0b18;--surface:#13132a;--card:#1a1a35;--border:#2a2a50;
  --accent:#00e5ff;--accent2:#ff2d78;--gold:#ffd700;--purple:#a855f7;
  --green:#22c55e;--red:#ef4444;--text:#f0f0ff;--muted:#8888aa;
  --np-border:#ff2d78;--np-bg:linear-gradient(135deg,rgba(255,45,120,.1),rgba(0,229,255,.06));
  --btn-primary:linear-gradient(135deg,#00e5ff,#0099bb);--btn-primary-text:#000;
  --btn-accent:linear-gradient(135deg,#ff2d78,#c2004a);
}
body[data-theme="fiesta"] {
  --bg:#1a0a00;--surface:#2a1200;--card:#351800;--border:#5a2d00;
  --accent:#ff8c00;--accent2:#ff3d00;--gold:#ffd700;--purple:#ff6b35;
  --green:#7bc67e;--red:#ef5350;--text:#fff8f0;--muted:#c49060;
  --np-border:#ff8c00;--np-bg:linear-gradient(135deg,rgba(255,140,0,.12),rgba(255,61,0,.06));
  --btn-primary:linear-gradient(135deg,#ff8c00,#cc6200);--btn-primary-text:#000;
  --btn-accent:linear-gradient(135deg,#ff3d00,#c62800);
}
body[data-theme="sakura"] {
  --bg:#1a0a12;--surface:#2a1020;--card:#38152a;--border:#5a2045;
  --accent:#ff80ab;--accent2:#f48fb1;--gold:#ffcc80;--purple:#ce93d8;
  --green:#a5d6a7;--red:#ef9a9a;--text:#fce4ec;--muted:#c48fa0;
  --np-border:#ff80ab;--np-bg:linear-gradient(135deg,rgba(255,128,171,.1),rgba(244,143,177,.06));
  --btn-primary:linear-gradient(135deg,#ff80ab,#c2185b);--btn-primary-text:#fff;
  --btn-accent:linear-gradient(135deg,#f48fb1,#ad1457);
}
body[data-theme="ocean"] {
  --bg:#021020;--surface:#041e38;--card:#062a4e;--border:#0d4a7a;
  --accent:#29b6f6;--accent2:#00e5ff;--gold:#ffd54f;--purple:#80deea;
  --green:#80cbc4;--red:#ef9a9a;--text:#e1f5fe;--muted:#5fa8c8;
  --np-border:#29b6f6;--np-bg:linear-gradient(135deg,rgba(41,182,246,.1),rgba(0,229,255,.06));
  --btn-primary:linear-gradient(135deg,#29b6f6,#0277bd);--btn-primary-text:#000;
  --btn-accent:linear-gradient(135deg,#00e5ff,#006064);
}
body[data-theme="forest"] {
  --bg:#071a0a;--surface:#0d2e12;--card:#133a18;--border:#1e5c26;
  --accent:#69f0ae;--accent2:#b9f6ca;--gold:#f9a825;--purple:#ce93d8;
  --green:#69f0ae;--red:#ef9a9a;--text:#e8f5e9;--muted:#6a9b72;
  --np-border:#69f0ae;--np-bg:linear-gradient(135deg,rgba(105,240,174,.1),rgba(185,246,202,.04));
  --btn-primary:linear-gradient(135deg,#69f0ae,#00695c);--btn-primary-text:#000;
  --btn-accent:linear-gradient(135deg,#b9f6ca,#2e7d32);
}

/* ── BASE STYLES ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background .35s,color .35s}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);transition:border-color .35s
}
.logo{font-family:'Bebas Neue';font-size:23px;letter-spacing:2px;color:var(--accent)}
.logo span{color:var(--accent2)}
.topbar-right{display:flex;align-items:center;gap:6px}
.room-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--border);
  padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:.15s
}
.icon-btn:hover{border-color:var(--accent)}

.screen{display:none;padding:62px 0 78px;max-width:860px;margin:0 auto;min-height:100vh}
.screen.active{display:block}
.pad{padding:16px 15px}

.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  display:flex;justify-content:space-around;
  background:rgba(0,0,0,.6);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:5px 0 max(5px,env(safe-area-inset-bottom));
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:5px 0;border:none;background:transparent;
  color:var(--muted);font-family:'Inter',sans-serif;transition:.15s;position:relative
}
.bnav-item.on{color:var(--accent)}
.bi{font-size:20px;line-height:1}
.bl{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.qbadge{
  position:absolute;top:2px;right:calc(50% - 18px);
  background:var(--accent2);color:#fff;font-size:9px;font-weight:800;
  min-width:15px;height:15px;border-radius:8px;
  display:none;align-items:center;justify-content:center;padding:0 3px
}
.qbadge.on{display:flex}

.sec{font-family:'Bebas Neue';font-size:18px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
.page-title{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;margin-bottom:3px}

.inp{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  color:var(--text);padding:11px 14px;border-radius:11px;
  font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.2s
}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
.inp.err{border-color:var(--red)!important;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:11px;font-size:14px;font-weight:700;
  cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:.16s;width:100%
}
.btn:active{transform:scale(.97);opacity:.88}
.btn-primary{background:var(--btn-primary);color:var(--btn-primary-text)}
.btn-accent{background:var(--btn-accent);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface)}
.btn-danger{background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.3);color:var(--red)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px;width:auto}
.row{display:flex;gap:8px}

/* ── HERO ── */
.hero{text-align:center;padding:28px 16px 22px}
.hero-title{
  font-family:'Bebas Neue';font-size:clamp(50px,12vw,92px);line-height:.88;letter-spacing:3px;
  background:linear-gradient(135deg,var(--accent) 20%,var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.hero-sub{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.6}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.hcard{
  background:var(--card);border:1.5px solid var(--border);border-radius:13px;
  padding:16px 12px;text-align:center;cursor:pointer;transition:.18s
}
.hcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.hcard:active{transform:scale(.97)}
.hc-icon{font-size:26px;margin-bottom:6px}
.hc-label{font-weight:700;font-size:13px}
.hc-sub{color:var(--muted);font-size:11px;margin-top:2px}

/* ── QR ── */
.qr-box{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:20px;text-align:center;margin-bottom:12px}
.qr-box h3{font-weight:700;font-size:15px;margin-bottom:12px}
#qrCanvas{margin:0 auto 12px;border-radius:8px;overflow:hidden;display:inline-block;background:#fff;padding:7px}
.room-code-big{font-family:'Bebas Neue';font-size:48px;letter-spacing:6px;color:var(--gold);line-height:1;margin-bottom:3px}
.qr-url{font-size:11px;color:var(--accent);word-break:break-all;padding:7px 10px;background:var(--surface);border-radius:7px;margin-bottom:10px;font-family:monospace}

/* ── SONGS ── */
.search-row{display:flex;gap:7px;margin-bottom:12px}
.search-row .inp{flex:1;margin:0}
.srch-btn{padding:11px 14px;background:var(--accent2);color:#fff;border-radius:11px;border:none;font-weight:700;cursor:pointer;font-size:13px;flex-shrink:0;font-family:'Inter',sans-serif}
.filter-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--surface);color:var(--muted);border:1.5px solid var(--border);white-space:nowrap;transition:.14s
}
.chip.on{background:var(--card);color:var(--text);border-color:var(--accent)}
.song-list{display:flex;flex-direction:column;gap:7px}
.song-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:13px;
  padding:11px 13px;display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:.16s;user-select:none;position:relative
}
.song-card:hover{border-color:var(--accent);background:var(--surface)}
.song-card:active{transform:scale(.98)}
.song-card.blocked{opacity:.45;cursor:not-allowed;pointer-events:none}
.song-card.blocked::after{
  content:'🚫 Recently sung';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--muted);font-weight:600
}
.sthumb{width:46px;height:36px;border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.stitle{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{color:var(--muted);font-size:11px;margin-top:1px}
.diff-tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;flex-shrink:0}
.easy{background:rgba(34,197,94,.12);color:#22c55e}
.med{background:rgba(251,191,36,.12);color:#fbbf24}
.hard{background:rgba(239,68,68,.12);color:#ef4444}

/* ── QUEUE ── */
.np-wrap{
  background:var(--np-bg);border:1.5px solid var(--np-border);
  border-radius:13px;padding:15px;margin-bottom:16px
}
.np-tag{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--np-border);text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.np-singer{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;line-height:1}
.np-song{color:var(--muted);font-size:12px;margin-top:2px}
.np-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.ctrl{
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--surface);color:var(--text);border:1.5px solid var(--border);
  font-family:'Inter',sans-serif;transition:.14s
}
.ctrl:hover{border-color:var(--accent);color:var(--accent)}
.ctrl.red:hover{border-color:var(--red);color:var(--red)}
.queue-items{display:flex;flex-direction:column;gap:6px}
.qi{
  background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 12px;display:flex;align-items:center;gap:10px;
  animation:fadeSlide .22s ease
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qi-pos{font-family:'Bebas Neue';font-size:16px;color:var(--muted);width:26px;text-align:center;flex-shrink:0}
.qi-pos.nxt{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:1px;font-family:'Inter'}
.qi-body{flex:1;min-width:0}
.qi-name{font-weight:700;font-size:13px}
.qi-song{color:var(--muted);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-del{
  width:30px;height:30px;border-radius:7px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  color:var(--red);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.14s
}
.qi-del:hover{background:rgba(239,68,68,.2)}
.empty-box{text-align:center;padding:32px 0;color:var(--muted)}
.empty-box .ei{font-size:38px;margin-bottom:8px}

/* ── ANTI-REPEAT NOTICE ── */
.ar-notice{
  background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.25);
  border-radius:10px;padding:10px 13px;font-size:12px;color:#f97316;
  margin-bottom:12px;line-height:1.6;display:none
}
.ar-notice.show{display:block}
.singer-limit-notice{
  background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);
  border-radius:9px;padding:9px 12px;font-size:12px;color:var(--red);
  margin-top:8px;display:none
}
.singer-limit-notice.show{display:block}

/* ── SCORE ── */
.score-top{text-align:center;padding:10px 0 18px}
.score-name{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px}
.score-songtxt{color:var(--muted);font-size:12px;margin-top:2px}
.big-score{
  font-family:'Bebas Neue';font-size:88px;line-height:1;
  background:linear-gradient(135deg,var(--gold),#ee7700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.sc-lbl{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.sc-box{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 6px;text-align:center}
.sc-val{font-family:'Bebas Neue';font-size:30px;line-height:1}
.sc-name{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.bars{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px;margin:9px 0}
.br{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.br:last-child{margin:0}
.br-lbl{font-size:11px;color:var(--muted);width:66px;flex-shrink:0}
.br-track{flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.br-fill{height:100%;border-radius:3px;width:0;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}
.br-val{font-size:11px;color:var(--muted);width:20px;text-align:right;flex-shrink:0}
.xp-card{
  background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(255,45,120,.07));
  border:1.5px solid var(--purple);border-radius:13px;
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin:9px 0
}
.xp-title{font-weight:700;font-size:15px;color:var(--purple)}
.xp-sub{font-size:11px;color:var(--muted);margin-top:2px}
.xp-pts{font-weight:800;font-size:17px;color:var(--gold)}

/* ── LEADERBOARD ── */
.lb-tabs{display:flex;gap:5px;margin-bottom:12px}
.lb-tab{
  flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--surface);color:var(--muted);font-family:'Inter',sans-serif;
  transition:.14s;border:1.5px solid transparent
}
.lb-tab.on{background:var(--card);color:var(--text);border-color:var(--border)}
.lb-row{
  background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:7px;transition:.14s
}
.lb-row:hover{transform:translateX(3px)}
.lb-row.r1{border-color:var(--gold)}
.lb-row.r2{border-color:#c0c0c0}
.lb-row.r3{border-color:#cd7f32}
.lb-rk{font-family:'Bebas Neue';font-size:19px;width:26px;text-align:center;flex-shrink:0}
.lb-av{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.lb-name{font-weight:700;font-size:13px}
.lb-tier{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-top:2px}
.lb-sc{font-family:'Bebas Neue';font-size:22px;color:var(--accent);flex-shrink:0}
.t-bronze{background:rgba(205,127,50,.14);color:#cd7f32}
.t-silver{background:rgba(192,192,192,.12);color:#c0c0c0}
.t-gold{background:rgba(255,215,0,.12);color:var(--gold)}
.t-platinum{background:rgba(0,229,255,.1);color:var(--accent)}
.t-diamond{background:rgba(168,85,247,.12);color:var(--purple)}
.t-legend{background:linear-gradient(135deg,rgba(255,45,120,.15),rgba(168,85,247,.15));color:var(--accent2)}

/* ── PLAYER ── */
.player-wrap{background:#000;border-radius:13px;overflow:hidden;position:relative;padding-top:56.25%;margin-bottom:12px}
.player-wrap iframe,.player-wrap #ytEl{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.player-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;background:var(--surface);font-size:13px}
.player-ph .pi{font-size:42px}
.vol-row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-bottom:8px}
input[type=range]{flex:1;accent-color:var(--accent)}
.key-row{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 11px;flex-wrap:wrap;margin-bottom:12px}
.key-lbl{font-size:11px;color:var(--muted);flex-shrink:0}
.key-val{font-family:'Bebas Neue';font-size:18px;color:var(--accent);min-width:32px;text-align:center}
.key-btn{width:30px;height:30px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s}
.key-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── THEME PICKER ── */
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.theme-opt{
  border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;
  border:2px solid transparent;transition:.16s;
}
.theme-opt:hover{transform:scale(1.04)}
.theme-opt.selected{border-color:white}
.theme-dot{width:28px;height:28px;border-radius:50%;margin:0 auto 5px}
.theme-name{font-size:11px;font-weight:700}

/* ── MODALS ── */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
  align-items:flex-end;justify-content:center
}
.modal-bg.open{display:flex}
.modal-box{
  background:var(--card);border:1.5px solid var(--border);border-radius:18px 18px 0 0;
  padding:22px 18px 30px;width:100%;max-width:520px;
  animation:slideUp .24s cubic-bezier(.25,.46,.45,.94)
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;margin-bottom:3px}
.modal-sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.confirm-bg{
  display:none;position:fixed;inset:0;z-index:310;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px
}
.confirm-bg.open{display:flex}
